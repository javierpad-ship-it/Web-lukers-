<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Postulaciones — LUKERS RR.HH.</title>
  <link rel="icon" type="image/png" href="assets/simbolo_LL_fondo_azul.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Archivo:wght@400;600;800;900&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/styles.css" />
  <link rel="stylesheet" href="css/admin.css" />
</head>
<body class="admin-body">

  <!-- LOGIN -->
  <div class="admin-login" id="loginView">
    <form class="admin-login-card" id="loginForm">
      <div class="admin-brand">
        <img src="assets/simbolo_LL_fondo_azul.png" alt="Lukers" />
        <h1>Postulaciones</h1>
        <p>Acceso de Recursos Humanos</p>
      </div>
      <label for="password">Contraseña de RR.HH.</label>
      <div class="pw-wrap">
        <input type="password" id="password" placeholder="••••••••" autocomplete="current-password" required />
        <button type="button" class="pw-eye" id="pwToggle" aria-label="Mostrar u ocultar contraseña">
          <svg id="eyeIcon" xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/>
          </svg>
        </button>
      </div>
      <button type="submit" class="btn btn-primary btn-block">Ingresar</button>
      <p class="admin-msg" id="loginMsg" role="status"></p>
    </form>
  </div>

  <!-- DASHBOARD -->
  <div class="admin-dash" id="dashView" hidden>
    <header class="admin-header">
      <div class="admin-header-inner">
        <a href="/" class="admin-logo" target="_blank" rel="noopener">LUKERS<span>.</span> <small>RR.HH.</small></a>
        <div class="admin-header-actions">
          <a class="btn btn-ghost btn-sm" id="exportBtn" href="#">⬇ Exportar CSV</a>
          <button class="btn btn-ghost btn-sm" id="logoutBtn">Cerrar sesión</button>
        </div>
      </div>
    </header>

    <main class="admin-main">
      <div class="admin-panel-head subs-head">
        <div>
          <h2>Postulaciones recibidas</h2>
          <p>Total: <strong id="appCount">0</strong> · Pasa el cursor sobre una fila para ver el mensaje.</p>
        </div>
      </div>
      <div class="table-wrap">
        <table class="subs-table">
          <thead>
            <tr><th>#</th><th>Nombre</th><th>Celular</th><th>DNI</th><th>Correo</th><th>Tienda</th><th>Jornada</th><th>Estudia</th><th>Fecha</th><th></th></tr>
          </thead>
          <tbody id="appsBody"></tbody>
        </table>
        <p class="subs-empty" id="appsEmpty" hidden>Aún no hay postulaciones.</p>
      </div>
    </main>
  </div>

  <div class="toast" id="toast" role="status"></div>

  <script src="js/postulaciones.js"></script>
</body>
</html>
